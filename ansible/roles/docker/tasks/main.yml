- name: Зависимости для репозитория
  ansible.builtin.apt:
    name: [ca-certificates, curl]
    state: present

- name: Ключ репозитория Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Репозиторий Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker

- name: Установить Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Пользователь в группе docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Docker запущен и включён
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true